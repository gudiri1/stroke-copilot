# Stroke Co-pilot — system model, single source of truth.
#
# Two generators read this file:
#   tools/gen_proto.py  -> proto/messages.py   (what every process imports)
#   the published model view                   (claude.ai artifact)
#
# Rename a block here and it renames itself in the code. Add a flow with no
# matching type and the generator fails. That is the point: the contract in
# your head stays the contract on the wire.

meta:
  project: Stroke Co-pilot
  track: "Robotics & AI Hackathon 2026 — Challenge 1, Improve Endovascular Procedures"
  framing: Research prototype. Not a medical device. No patient data at any stage.
  transport: ZeroMQ PUB/SUB over ipc://, msgpack header plus optional raw payload part
  endpoint: ipc:///tmp/stroke-copilot

# --- timing constants, all derived rather than chosen ----------------------
constants:
  frame_rate_hz: 7.5          # stEVE control and imaging frequency; pulsed neuro fluoroscopy
  frame_period_ms: 133.3      # 1000 / 7.5
  frame_w: 512
  frame_h: 512
  px_mm: 0.39                 # 200 mm detector field of view across 512 px
  # 0.39 mm / 0.1333 s = 2.9 mm/s is the fastest advance that keeps visual
  # servoing inside one pixel per correction. Capped at 3 for a round number.
  advance_max_mm_s: 3.0
  watchdog_ms: 100
  # drive wheel 20 mm diameter, NEMA17 1.8 deg, TMC2209 at 1/16 microstepping
  # pi * 20 mm / 3200 microsteps = 19.635 um per microstep
  microstep_nm: 19635

# --- wire types ------------------------------------------------------------
types:
  Frame:
    seq: u64                  # monotonic, shared across every topic
    t_capture_ns: u64
    w: u16
    h: u16
    fmt: str                  # "mono8"
    px_mm: f32
    source: str               # sofa | replay | camera | carm
    # payload: raw bytes, second ZMQ part, w*h for mono8

  Tip:
    seq: u64
    t_ns: u64
    tip_px: list              # [u, v]
    conf: f32                 # 0..1, the number the safety gate consumes
    wire_px: list             # [[u, v], ...] distal to proximal, may be empty
    latency_ms: f32

  Guidance:
    seq: u64
    t_ns: u64
    node: str                 # current graph node, "" if unknown
    next: str                 # next node on the target path
    dist_px: i32              # to the next bifurcation, -1 if unknown
    state: str                # on_path | off_path | unknown
    event: str                # "" | bifurcation_ahead | wrong_branch | target_reached | handover
    conf: f32

  Cmd:
    seq: u64                  # the frame this command answers
    t_ns: u64
    advance_mm_s: f32         # positive advances, negative retracts
    deadman_seq: u64          # firmware echoes it back; a stalled host is visible from both ends

# --- flows -----------------------------------------------------------------
flows:
  frame:    {type: Frame,    from: SC.SRC,  to: [SC.EYE, SC.MAP], rate_hz: 7.5}
  tip:      {type: Tip,      from: SC.EYE,  to: [SC.BRN],         rate_hz: 7.5}
  guidance: {type: Guidance, from: SC.BRN,  to: [SC.OUT],         rate_hz: 7.5}
  cmd:      {type: Cmd,      from: SC.BRN,  to: [SC.GATE],        rate_hz: 7.5}

# --- containment -----------------------------------------------------------
# owner: EMB | AI | BIZ        stage: cut-line stage it must survive
# status: planned | building | done | open
blocks:
  SC:
    name: Stroke Co-pilot
    kind: system
    children: [SC.SRC, SC.EYE, SC.MAP, SC.BRN, SC.OUT, SC.GATE, SC.DRV]

  SC.SRC:
    name: Source adapters
    owner: EMB
    stage: 1
    status: building
    ports: {in: [raw video], out: [frame]}
    children: [SRC.SOFA, SRC.REPLAY, SRC.CAM, SRC.CARM, SRC.PUB]
    questions: [T1]
    note: Four interchangeable producers of one contract. The single structural
      hedge against not knowing what the organizers supply.

  SRC.SOFA:   {name: sofa,   owner: EMB, stage: 2, status: planned, questions: [T2], evidence: [P03]}
  SRC.REPLAY: {name: replay, owner: AI,  stage: 1, status: building, questions: [Q6, T2], evidence: [P03]}
  SRC.CAM:    {name: camera, owner: EMB, stage: 3, status: planned}
  SRC.CARM:   {name: carm,   owner: EMB, stage: 4, status: open,     questions: [T1]}
  SRC.PUB:    {name: Frame publisher, owner: EMB, stage: 1, status: planned}

  SC.EYE:
    name: Eyes
    owner: AI
    stage: 1
    status: planned
    ports: {in: [frame], out: [tip]}
    children: [EYE.PRE, EYE.INF, EYE.POST, EYE.CONF]
    questions: [T2, Q6]
    evidence: [P01, P03, P04]

  EYE.PRE:  {name: Preprocess,  owner: AI, stage: 1, status: planned, budget_ms: 2}
  EYE.INF:  {name: Inference,   owner: AI, stage: 1, status: planned, budget_ms: 8, evidence: [P01]}
  EYE.POST: {name: Postprocess, owner: AI, stage: 1, status: planned, budget_ms: 4, evidence: [P01]}
  EYE.CONF: {name: Confidence,  owner: AI, stage: 1, status: planned, questions: [T4]}

  SC.MAP:
    name: Roadmap
    owner: AI
    stage: 2
    status: planned
    ports: {in: [frame], out: [graph]}
    children: [MAP.GRAPH, MAP.REG]
    questions: [Q4]
    evidence: [P04, P05]

  MAP.GRAPH: {name: Vessel graph,        owner: AI, stage: 2, status: planned}
  MAP.REG:   {name: 2D-2D registration,  owner: AI, stage: 2, status: planned, questions: [Q4]}

  SC.BRN:
    name: Brain
    owner: AI
    stage: 1
    status: planned
    ports: {in: [tip, graph], out: [guidance, cmd]}
    children: [BRN.MATCH, BRN.PLAN, BRN.FSM, BRN.EVT]
    questions: [T2, T4]
    evidence: [P03]
    note: A state machine on the graph. No learned policy on the critical path
      for the demo; a policy that cannot explain itself is the wrong thing to
      put in front of this jury.

  BRN.MATCH: {name: Graph matcher,  owner: AI, stage: 1, status: planned}
  BRN.PLAN:  {name: Path,           owner: AI, stage: 1, status: planned}
  BRN.FSM:   {name: State machine,  owner: AI, stage: 1, status: planned}
  BRN.EVT:   {name: Events,         owner: AI, stage: 1, status: planned, questions: [T4]}

  SC.OUT:
    name: Operator output
    owner: EMB
    stage: 1
    status: planned
    ports: {in: [guidance], out: [pixels, audio]}
    children: [OUT.OVL, OUT.VOICE]
    evidence: [P11]

  OUT.OVL:   {name: Overlay, owner: EMB, stage: 1, status: planned, budget_ms: 5}
  OUT.VOICE: {name: Voice,   owner: EMB, stage: 1, status: planned, evidence: [P11]}

  SC.GATE:
    name: Safety gate
    kind: safety
    owner: EMB
    stage: 3
    status: planned
    ports: {in: [cmd, confidence, override], out: [gated cmd]}
    children: [GATE.CONF, GATE.WDG, GATE.RATE, GATE.HAND]
    questions: [T4]
    evidence: [P02]
    note: The only path from the AI to anything that moves.

  GATE.CONF: {name: Confidence floor, owner: EMB, stage: 3, status: planned}
  GATE.WDG:  {name: Watchdog,         owner: EMB, stage: 3, status: planned}
  GATE.RATE: {name: Rate limit,       owner: EMB, stage: 3, status: planned}
  GATE.HAND: {name: Handover,         owner: EMB, stage: 3, status: planned, questions: [T4]}

  SC.DRV:
    name: Driver interface
    owner: EMB
    stage: 3
    status: planned
    ports: {in: [gated cmd], out: [step pulses, status]}
    children: [DRV.LINK, DRV.FW]

  DRV.LINK: {name: Host link,     owner: EMB, stage: 3, status: planned}
  DRV.FW:   {name: Pico firmware, owner: EMB, stage: 3, status: planned,
             children: [FW.LOOP, FW.PIO, FW.SAFE, FW.PINS]}

  FW.LOOP: {name: Control loop,       owner: EMB, stage: 3, status: planned}
  FW.PIO:  {name: PIO step generator, owner: EMB, stage: 3, status: planned}
  FW.SAFE: {name: Stop paths,         owner: EMB, stage: 3, status: open, evidence: [P02],
            note: "StallGuard4 needs a minimum velocity. 153 microsteps/s is about
                   2.9 rpm, almost certainly below it. Keep the load cell."}
  FW.PINS: {name: Pin map,            owner: EMB, stage: 3, status: planned}

# --- open questions --------------------------------------------------------
questions:
  T1: What does Siemens provide at the hackathon? Ask before 22 Oct.
  T2: How do we answer the sim-to-real gap?
  T3: Is the remote live view fast enough?
  T4: When does the AI hand control back?
  Q3: Why hasn't radiation-free navigation reached the brain?
  Q4: Does the moving-map problem matter in the brain?
  Q5: Does Siemens' robot need our eyes?
  Q6: Which datasets can we train and test on?
  Q7: Can a general interventionalist do this with remote guidance?
  Q8: Will Siemens ask for exclusivity?

# --- evidence, see papers/README.md ---------------------------------------
evidence:
  P01: Real-Time Pose Tracking for a Continuum Guidewire Robot Under Fluoroscopic Imaging
  P02: Simultaneous Shape and Tip Force Sensing for the COAST Guidewire Robot
  P03: Autonomous navigation of catheters and guidewires
  P04: Advanced intraprocedural image guidance
  P05: Endovascular navigation — RealShape fibre-optic (FORS)
  P06: Endovascular navigation in patients
  P07: Nypan et al. 2022 — steerable, EM-tracked catheter vs image fusion
  P08: Electromagnetic tracking
  P09: Radiation-free complex navigation
  P10: Radiation — TEVAR
  P11: Distractions in the cardiac catheterisation laboratory
  P12: Behind the wall of industry payments
  P13: novel_lolo — not read yet
  P14: 1-s2.0-S2772930326010574 — not read yet
